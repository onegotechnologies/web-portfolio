  <body>
    <!-- Netlify's deploy bot uses this static form blueprint to register the
         JavaScript-rendered contact form. Keep its fields in sync with the
         form in CtaBanner.tsx. -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="company" />
      <input name="phone" type="tel" />
      <select name="interest">
        <option value="Software Engineering">Software Engineering</option>
      </select>
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
